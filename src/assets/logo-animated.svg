<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00FFDD"/>
            <stop offset="100%" style="stop-color:#FF2D78"/>
        </linearGradient>
        <filter id="neon">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>

    <style>
        @keyframes drawRing {
            from { stroke-dashoffset: 580; }
            to { stroke-dashoffset: 0; }
        }
        @keyframes drawBand {
            from { stroke-dashoffset: 300; opacity: 0; }
            to { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes drawDome {
            from { stroke-dashoffset: 200; opacity: 0; }
            to { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes popIn {
            0% { r: 0; opacity: 0; }
            60% { r: 10; opacity: 1; }
            80% { r: 7; }
            100% { r: 8; opacity: 1; }
        }
        @keyframes bar1 {
            0%, 100% { height: 28; y: 98; }
            25% { height: 18; y: 108; }
            50% { height: 35; y: 91; }
            75% { height: 22; y: 104; }
        }
        @keyframes bar2 {
            0%, 100% { height: 42; y: 98; }
            30% { height: 30; y: 110; }
            60% { height: 50; y: 90; }
            80% { height: 35; y: 105; }
        }
        @keyframes bar3 {
            0%, 100% { height: 52; y: 98; }
            20% { height: 40; y: 110; }
            45% { height: 58; y: 92; }
            70% { height: 35; y: 115; }
        }
        @keyframes bar4 {
            0%, 100% { height: 48; y: 98; }
            35% { height: 55; y: 91; }
            55% { height: 32; y: 114; }
            85% { height: 45; y: 101; }
        }
        @keyframes bar5 {
            0%, 100% { height: 36; y: 98; }
            25% { height: 45; y: 89; }
            50% { height: 25; y: 109; }
            80% { height: 40; y: 94; }
        }
        @keyframes bar6 {
            0%, 100% { height: 22; y: 98; }
            30% { height: 30; y: 90; }
            60% { height: 15; y: 105; }
            85% { height: 28; y: 92; }
        }
        @keyframes fadeInBars {
            from { opacity: 0; transform: scaleY(0); }
            to { opacity: 1; transform: scaleY(1); }
        }

        .ring {
            stroke-dasharray: 580;
            animation: drawRing 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .band {
            stroke-dasharray: 300;
            animation: drawBand 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        }
        .dome {
            stroke-dasharray: 200;
            animation: drawDome 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
        }
        .ear-l { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s both; }
        .ear-r { animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.9s both; }

        .b1 { animation: fadeInBars 0.3s ease 1.0s both, bar1 1.8s ease-in-out 1.3s infinite; }
        .b2 { animation: fadeInBars 0.3s ease 1.1s both, bar2 1.5s ease-in-out 1.4s infinite; }
        .b3 { animation: fadeInBars 0.3s ease 1.2s both, bar3 1.3s ease-in-out 1.5s infinite; }
        .b4 { animation: fadeInBars 0.3s ease 1.3s both, bar4 1.4s ease-in-out 1.6s infinite; }
        .b5 { animation: fadeInBars 0.3s ease 1.4s both, bar5 1.6s ease-in-out 1.7s infinite; }
        .b6 { animation: fadeInBars 0.3s ease 1.5s both, bar6 1.9s ease-in-out 1.8s infinite; }
    </style>

    <!-- Background -->
    <circle cx="100" cy="100" r="92" fill="#080810"/>

    <!-- Outer ring - draws in -->
    <circle class="ring" cx="100" cy="100" r="92" fill="none" stroke="url(#grad)" stroke-width="2" filter="url(#neon)"/>

    <!-- Jellyfish dome -->
    <path class="dome" d="M 58 90 Q 58 50, 100 45 Q 142 50, 142 90" fill="none" stroke="#00FFDD" stroke-width="3" stroke-linecap="round" filter="url(#neon)"/>
    <path d="M 58 90 Q 58 50, 100 45 Q 142 50, 142 90 Z" fill="#00FFDD" opacity="0.05"/>

    <!-- Headphone band -->
    <path class="band" d="M 48 88 Q 48 38, 100 30 Q 152 38, 152 88" fill="none" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round" filter="url(#neon)"/>

    <!-- Ear cups - pop in -->
    <circle class="ear-l" cx="48" cy="88" r="8" fill="#00FFDD" filter="url(#neon)"/>
    <circle class="ear-r" cx="152" cy="88" r="8" fill="#FF2D78" filter="url(#neon)"/>

    <!-- Equalizer bars - bounce -->
    <rect class="b1" x="72" y="98" width="4" height="28" rx="2" fill="#00FFDD" opacity="0.6" filter="url(#neon)"/>
    <rect class="b2" x="82" y="98" width="4" height="42" rx="2" fill="#00FFDD" opacity="0.8" filter="url(#neon)"/>
    <rect class="b3" x="92" y="98" width="4" height="52" rx="2" fill="#00FFDD" filter="url(#neon)"/>
    <rect class="b4" x="102" y="98" width="4" height="48" rx="2" fill="#FF2D78" filter="url(#neon)"/>
    <rect class="b5" x="112" y="98" width="4" height="36" rx="2" fill="#FF2D78" opacity="0.8" filter="url(#neon)"/>
    <rect class="b6" x="122" y="98" width="4" height="22" rx="2" fill="#FF2D78" opacity="0.6" filter="url(#neon)"/>
</svg>
